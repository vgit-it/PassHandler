[package]
name = "tauri-plugin-vault"
version = "1.0.0"
description = "Platform-specific plumbing for Vault: OS secure storage, biometric gates, screen-capture protection and sensitive-clipboard handling"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-vault"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Desktop clipboard goes through the official plugin. Android does not: the
# sensitive-content flag it needs has no cross-platform equivalent, so the
# mobile implementation writes the clipboard from Kotlin instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-clipboard-manager = "2"

# Windows Credential Manager. On Android this crate is not used at all — the
# mobile implementation calls into Kotlin, which stores through the Android
# Keystore instead.
#
# `rfd` (the native Save-As dialog for vault export) is Windows-only here too
# — not just Windows-only in behaviour. Its Linux backend needs GTK (or an
# XDG portal) at link time, and the Linux target below exists purely so the
# pure-Rust layers type-check in CI without a Windows machine; pulling GTK in
# there would be a new, unrelated way for that check to break.
# `default-features = false` drops rfd's Linux/Wayland/XDG-portal machinery
# entirely — the Windows backend needs none of it.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
rfd = { version = "0.17", default-features = false }
# Decodes the base64'd vault bytes handed to `export_vault` before writing
# them out. Not needed on the mobile side — Kotlin decodes there instead.
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
    # Manual-fill's `SendInput`-based auto-type — see `docs/MANUAL-FILL-DESIGN.md`.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Real password-field detection for "Fill, then Tab" via UI Automation
    # (`desktop.rs`'s `ui_automation` module) — CoCreateInstance/CoInitializeEx,
    # IUIAutomation/IUIAutomationElement, and the VARIANT the property read
    # comes back as.
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
]

# Linux is not a supported target — it exists only so the pure-Rust layers can
# be type-checked in CI without a Windows machine. Secure storage and biometrics
# report as unavailable there rather than pretending to work.
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { version = "2" }
