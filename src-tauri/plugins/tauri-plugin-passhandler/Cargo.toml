[package]
name = "tauri-plugin-passhandler"
version = "1.0.0"
description = "Platform-specific plumbing for Pass Handler: OS secure storage, biometric gates, screen-capture protection and sensitive-clipboard handling"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-passhandler"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Desktop clipboard goes through the official plugin. Android does not: the
# sensitive-content flag it needs has no cross-platform equivalent, so the
# mobile implementation writes the clipboard from Kotlin instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-clipboard-manager = "2"

# Windows Credential Manager. On Android this crate is not used at all — the
# mobile implementation calls into Kotlin, which stores through the Android
# Keystore instead.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
]

# Linux is not a supported target — it exists only so the pure-Rust layers can
# be type-checked in CI without a Windows machine. Secure storage and biometrics
# report as unavailable there rather than pretending to work.
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { version = "2" }
