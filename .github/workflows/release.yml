name: Release

# CI proves the code compiles on both platforms. This produces the things you
# actually install: release-profile builds, stripped and minified, one APK per
# architecture instead of the ~640 MB universal debug APK that CI uploads.
#
# Push a `v*` tag to cut a release. Run it by hand from the Actions tab to get
# installers without tagging — the build jobs run and upload artifacts, and the
# publish job is skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android_targets:
        description: "Android architectures (comma-separated: aarch64, armv7, i686, x86_64)"
        default: aarch64
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release

      - run: npm ci

      # `tauri build` is release by default: the profile in Cargo.toml applies,
      # so this is LTO'd, size-optimised and stripped.
      - name: Build installers
        run: npx tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/release/bundle/msi/*.msi dist/
          {
            echo "## Windows"
            echo
            for f in dist/*; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*
          if-no-files-found: error

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK and NDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # All four are installed regardless of what gets built — they are only
      # std downloads, and it keeps this step independent of the input.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-release

      - run: npm ci

      # Empty on a tag push, where the input does not exist. Nearly every
      # Android device since 2017 is arm64-v8a, so that is the default; the
      # release profile uses LTO with one codegen unit, and each extra
      # architecture is a full extra compile.
      - name: Resolve architectures
        # Through the environment rather than interpolated into the script, so
        # the input is data and never shell.
        env:
          TARGETS: ${{ inputs.android_targets }}
        run: |
          list=$(echo "${TARGETS:-aarch64}" | tr ',' ' ')
          for t in $list; do
            case "$t" in
              aarch64|armv7|i686|x86_64) ;;
              *) echo "unknown architecture: $t" >&2; exit 1 ;;
            esac
          done
          echo "TARGET_LIST=$list" >> "$GITHUB_ENV"

      - name: Initialise the Android project
        run: npx tauri android init

      # --split-per-abi gives one APK per architecture rather than a universal
      # APK carrying every one of them. --target is last because it takes a
      # variable number of values, and $TARGET_LIST is deliberately unquoted so
      # several architectures arrive as separate arguments.
      - name: Build release APKs
        run: npx tauri android build --apk --split-per-abi --target $TARGET_LIST

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/sign-apks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Both build jobs upload flat files, so merge-multiple lands everything
      # side by side in one directory.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # `gh` is preinstalled on the runner. Using it rather than a third-party
      # release action keeps one less unpinned dependency in the pipeline that
      # publishes a password manager.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pass Handler $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
